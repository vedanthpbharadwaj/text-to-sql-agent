services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-nyc_taxi}
      ANALYST_RO_PASSWORD: ${ANALYST_RO_PASSWORD:-analyst_ro}
    # Tuned for analytic scans over tens of millions of rows on a laptop.
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c max_parallel_workers_per_gather=4
      -c effective_cache_size=3GB
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      # The API only ever uses the read-only role.
      DATABASE_URL: postgresql://analyst_ro:${ANALYST_RO_PASSWORD:-analyst_ro}@db:5432/${POSTGRES_DB:-nyc_taxi}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
